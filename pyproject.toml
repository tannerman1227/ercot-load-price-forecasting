[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ercot-forecast"
version = "0.1.0"
description = "Day-ahead ERCOT load and Houston hub price study"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.8,<4",
    "plotly>=5.22,<6",
    "streamlit>=1.32,<2",
    "openpyxl>=3.1,<4",
    "python-calamine>=0.2,<1",
    "pyarrow>=15,<22",
    "requests>=2.31,<3",
    "holidays>=0.40,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
